name: Ferlease PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled]

concurrency:
  group: ferlease-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ferlease-release:
    if: >
      github.event.action != 'closed' &&
      (startsWith(github.event.pull_request.head.ref, 'feat/') || startsWith(github.event.pull_request.head.ref, 'fix/') ||
       startsWith(github.event.pull_request.head.ref, 'refactor/') || startsWith(github.event.pull_request.head.ref, 'perf/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.value }}
      url: ${{ steps.release.outputs.url }}

    steps:
      - name: Extract release
        id: release
        run: |
          branch="${{ github.head_ref }}"
          release="${branch#*/}"
          release=$(echo "$release" | tr '[:upper:]' '[:lower:]')
          echo "value=${release}" >> "$GITHUB_OUTPUT"
          echo "url=https://portail-${release}.dev.qlin.aws.sante.quebec" >> "$GITHUB_OUTPUT"

      - name: Write SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.INFRA_REPO_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/id_rsa"
          echo "$DEPLOY_KEY" > "$RUNNER_TEMP/id_rsa"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$RUNNER_TEMP/known_host" 2>/dev/null

      - name: Pull ferlease binary
        run: |
          container=$(docker create ferlabcrsj/ferlease:0.2.2)
          docker cp "$container:/bin/ferlease" ./ferlease
          docker rm "$container"
          chmod +x ./ferlease

      - name: Write ferlease config
        run: |
          cat > ferlease-config.yml <<EOF
          service: radiant-portal-ui
          release: ${{ steps.release.outputs.value }}
          environment: dev
          repo: git@github.com:Ferlab-Ste-Justine/qlin-qa-infra.git
          ref: main
          git_auth:
            ssh_key: $RUNNER_TEMP/id_rsa
            known_key: $RUNNER_TEMP/known_host
          author:
            name: ferlab-automation
            email: automation@ferlab.bio
          template_directory: "{{.RepoDir}}/ferlease-templates/{{.Service}}"
          commit_message: "{{ if eq .Operation \"release\" }}Adding{{ else }}Removing{{ end }} release {{.Release}} of service {{.Service}}"
          push_retries: 60
          push_retry_interval: 5s
          EOF

      - name: Run ferlease release
        run: ./ferlease release -c ferlease-config.yml

      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          URL: ${{ steps.release.outputs.url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"attachments\":[{\"title\":\"New Radiant Release : Ticket: ${PR_TITLE}\",\"text\":\"You can find the new release for Radiant at ${URL}\",\"color\":\"good\"}]}"

  cypress:
    needs: ferlease-release
    if: >
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'cypress') &&
      (startsWith(github.event.pull_request.head.ref, 'feat/') || startsWith(github.event.pull_request.head.ref, 'fix/') ||
       startsWith(github.event.pull_request.head.ref, 'refactor/') || startsWith(github.event.pull_request.head.ref, 'perf/'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Notify Slack launch
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          BRANCH: ${{ github.head_ref }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"attachments\":[{\"title\":\"Ferlease - Cypress Launch Attempt (Radiant) ⚙️\",\"text\":\"Cypress tests are starting ✈️ for branch: ${BRANCH}\",\"color\":\"good\"}]}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311752058468:role/qlin-ferlease-cypress
          aws-region: ca-central-1

      - name: Upload source to S3
        env:
          RELEASE: ${{ needs.ferlease-release.outputs.release }}
        run: |
          tar -czf /tmp/cypress-source.tar.gz \
            package.json package-lock.json \
            cypress/ cypress.config.ts tsconfig.json
          aws s3 cp /tmp/cypress-source.tar.gz \
            "s3://qlin-dev-cypress-artifacts/$RELEASE/source.tar.gz"

      - name: Run Cypress via ECS Fargate
        env:
          RELEASE: ${{ needs.ferlease-release.outputs.release }}
          CYPRESS_BASE_URL: ${{ needs.ferlease-release.outputs.url }}/
          CYPRESS_USER_USERNAME: ${{ secrets.CYPRESS_USER_USERNAME }}
          CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.CYPRESS_KEYCLOAK_CLIENT_SECRET }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=ferlease-cypress-task \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          OVERRIDES=$(jq -cn \
            --arg release "$RELEASE" \
            --arg base_url "$CYPRESS_BASE_URL" \
            --arg username "$CYPRESS_USER_USERNAME" \
            --arg password "$CYPRESS_USER_PASSWORD" \
            --arg kc_secret "$KEYCLOAK_CLIENT_SECRET" \
            --arg slack_webhook "$SLACK_WEBHOOK" \
            '{containerOverrides:[{name:"ferlease-cypress",environment:[
              {name:"RELEASE",value:$release},
              {name:"CYPRESS_BASE_URL",value:$base_url},
              {name:"CYPRESS_USER_USERNAME",value:$username},
              {name:"CYPRESS_USER_PASSWORD",value:$password},
              {name:"KEYCLOAK_CLIENT_SECRET",value:$kc_secret},
              {name:"SLACK_WEBHOOK",value:$slack_webhook}
            ]}]}')

          aws ecs run-task \
            --cluster pipelines \
            --task-definition ferlease-cypress \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-07cac0f9ab50d76ed,subnet-0be9fa70291f7c86c],assignPublicIp=DISABLED,securityGroups=[$SG_ID]}" \
            --overrides "$OVERRIDES" \
            --output text

  ferlease-teardown:
    if: >
      github.event.action == 'closed' &&
      (startsWith(github.event.pull_request.head.ref, 'feat/') || startsWith(github.event.pull_request.head.ref, 'fix/') ||
       startsWith(github.event.pull_request.head.ref, 'refactor/') || startsWith(github.event.pull_request.head.ref, 'perf/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Extract release
        id: release
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          release="${branch#*/}"
          release=$(echo "$release" | tr '[:upper:]' '[:lower:]')
          echo "value=${release}" >> "$GITHUB_OUTPUT"

      - name: Write SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.INFRA_REPO_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/id_rsa"
          echo "$DEPLOY_KEY" > "$RUNNER_TEMP/id_rsa"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$RUNNER_TEMP/known_host" 2>/dev/null

      - name: Pull ferlease binary
        run: |
          container=$(docker create ferlabcrsj/ferlease:0.2.2)
          docker cp "$container:/bin/ferlease" ./ferlease
          docker rm "$container"
          chmod +x ./ferlease

      - name: Write ferlease config
        run: |
          cat > ferlease-config.yml <<EOF
          service: radiant-portal-ui
          release: ${{ steps.release.outputs.value }}
          environment: dev
          repo: git@github.com:Ferlab-Ste-Justine/qlin-qa-infra.git
          ref: main
          git_auth:
            ssh_key: $RUNNER_TEMP/id_rsa
            known_key: $RUNNER_TEMP/known_host
          author:
            name: ferlab-automation
            email: automation@ferlab.bio
          template_directory: "{{.RepoDir}}/ferlease-templates/{{.Service}}"
          commit_message: "{{ if eq .Operation \"release\" }}Adding{{ else }}Removing{{ end }} release {{.Release}} of service {{.Service}}"
          push_retries: 60
          push_retry_interval: 5s
          EOF

      - name: Run ferlease teardown
        run: ./ferlease teardown -c ferlease-config.yml
